version: '3.8'

# 배포 스펙 탐색용 - 애플리케이션 리소스 제한 설정
# 아래 deploy.resources 값을 조절하며 시나리오 C 테스트 수행
#
# 실행 방법:
#   docker build -t hhplus-server .
#   docker-compose -f docker-compose.yml -f docker-compose.app.yaml up -d

services:
  app:
    image: hhplus-server:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hhplus?characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: application
      SPRING_DATASOURCE_PASSWORD: application
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29093,broker3:29094
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          # 스펙 A (최소): 0.5 core / 512MB
          # 스펙 B (권장): 1 core   / 1GB    ← 현재 설정
          # 스펙 C (여유): 2 core   / 2GB
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: application
      MYSQL_PASSWORD: application
      MYSQL_DATABASE: hhplus
    volumes:
      - ./data/mysql/:/var/lib/mysql

  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
